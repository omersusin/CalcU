name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleDebug --stacktrace
      - name: Prove APK was created
        run: ls -lh app/build/outputs/apk/debug/ && du -h app/build/outputs/apk/debug/*.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Bootstrap release keystore (one-time)
        run: |
          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore /tmp/calcu-release.keystore -storetype PKCS12 -alias calcu -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CalcU, OU=CalcU, O=CalcU" -storepass "$STORE_PASS" -keypass "$KEY_PASS"
          echo -n "$STORE_PASS" > /tmp/store.pass
          echo -n "$KEY_PASS" > /tmp/key.pass
          echo -n "calcu" > /tmp/alias.txt
      - name: Upload keystore bootstrap files
        uses: actions/upload-artifact@v4
        with:
          name: calcu-keystore-bootstrap
          path: |
            /tmp/calcu-release.keystore
            /tmp/store.pass
            /tmp/key.pass
            /tmp/alias.txt
          if-no-files-found: error
      - name: Attach APK to rolling latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/*.apk --title "Latest debug build" --notes "Automated debug APK from main (${{ github.sha }})."
