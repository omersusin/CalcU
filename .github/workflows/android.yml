name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:testDebugUnitTest --stacktrace
      - run: gradle :app:assembleDebug --stacktrace
      - run: gradle :app:lintDebug --stacktrace
        continue-on-error: true
      - name: Prove APK was created
        run: ls -lh app/build/outputs/apk/debug/ && du -h app/build/outputs/apk/debug/*.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcu-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/calcu-release.keystore
            echo "KEYSTORE_PATH=/tmp/calcu-release.keystore" >> "$GITHUB_ENV"
          fi
      - run: gradle :app:assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Verify release signature
        if: env.KEYSTORE_PATH != ''
        run: $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/*.apk | head -5
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calcu-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Attach APK to rolling latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk --title "Latest build" --notes "Debug + signed release APKs from main (${{ github.sha }})."
