[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"
hilt = "2.51.1"
composeBom = "2024.09.00"
coreKtx = "1.13.1"
lifecycle = "2.7.0"
activityCompose = "1.9.2"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
coroutines = "1.8.1"
serialization = "1.7.3"
datastore = "1.1.1"
